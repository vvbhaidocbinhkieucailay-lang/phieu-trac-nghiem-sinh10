<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 505" width="640" height="505" role="img"><title>Enzyme X: xử lí và hoạt tính</title><rect width="640" height="505" rx="16" fill="#f6f9fd"/>
