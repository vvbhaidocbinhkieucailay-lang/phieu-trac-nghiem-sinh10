<text x="549" y="289" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="23" fill="#233c52" font-weight="700">D</text>
<circle cx="40" cy="331" r="15" fill="#2854ac" stroke="none" stroke-width="2"/>
