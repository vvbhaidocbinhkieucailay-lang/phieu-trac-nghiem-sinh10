<text x="65" y="411" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" fill="#233c52" font-weight="400">Làm lạnh 5 °C → đưa về 25 °C để đo</text>
<circle cx="40" cy="451" r="15" fill="#b56a16" stroke="none" stroke-width="2"/>
