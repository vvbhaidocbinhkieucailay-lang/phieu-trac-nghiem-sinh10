<text x="412" y="289" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="23" fill="#233c52" font-weight="700">C</text>
<line x1="519" y1="262" x2="579" y2="262" stroke="#b56a16" stroke-width="5"/>
