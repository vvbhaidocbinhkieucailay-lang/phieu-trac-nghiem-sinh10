<text x="275" y="289" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="23" fill="#233c52" font-weight="700">B</text>
<rect x="382" y="102.0" width="60" height="160.0" rx="3" fill="#177c68" stroke="#177c68" stroke-width="2"/>
